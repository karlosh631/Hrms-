name: Daily human-like commits

on:
  schedule:
    - cron: '0 10 * * *' # 10:00 AM GMT daily
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run daily contributor script
        run: |
          python scripts/daily_contributor.py

      - name: Short sleep after work done (simulate small human delay)
        run: |
          # small fixed delay to ensure files are flushed and to mimic a short pause
          sleep 5

      - name: Configure git identity
        run: |
          git config user.name "Karlosh Thapa"
          git config user.email "thapakarlosh631@gmail.com"

      - name: Stage modified files
        id: stage
        run: |
          # If the script wrote .modified_files, stage those lines (safe).
          if [ -f .modified_files ]; then
            echo "Staging files listed in .modified_files"
            while IFS= read -r f || [ -n "$f" ]; do
              if [ -e "$f" ]; then
                git add "$f" || true
              fi
            done < .modified_files
          else
            echo ".modified_files not found; staging all changes"
            git add -A
          fi

          # Signal whether there are staged changes
          if git diff --staged --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if no changes
        if: steps.stage.outputs.no_changes == 'true'
        run: |
          echo "No staged changes; exiting."

      - name: Read new commit message and last commit
        if: steps.stage.outputs.no_changes == 'false'
        id: compare
        run: |
          NEW_MSG=""
          if [ -f .commit_message ]; then
            NEW_MSG="$(cat .commit_message | sed 's/\r$//')"
          else
            NEW_MSG="chore: daily notes update"
          fi
          # Last commit message (may be empty on first commit)
          LAST_MSG="$(git log -1 --pretty=%B 2>/dev/null || true)"
          echo "new_msg<<EOF" >> $GITHUB_OUTPUT
          echo "$NEW_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "last_msg<<EOF" >> $GITHUB_OUTPUT
          echo "$LAST_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Skip commit if duplicate last message
        if: steps.stage.outputs.no_changes == 'false'
        run: |
          NEW_MSG="${{ steps.compare.outputs.new_msg }}"
          LAST_MSG="${{ steps.compare.outputs.last_msg }}"
          echo "Last commit message: [$LAST_MSG]"
          echo "New commit message:  [$NEW_MSG]"
          if [ "$LAST_MSG" = "$NEW_MSG" ]; then
            echo "Duplicate commit message detected; skipping commit."
            # Reset staged changes so we don't leave them staged
            git reset
            exit 0
          fi

      - name: Commit and push
        if: steps.stage.outputs.no_changes == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_MSG="$(cat .commit_message || echo "chore: daily notes update")"
          git commit -m "$NEW_MSG" --author="Karlosh Thapa <thapakarlosh631@gmail.com>"
          # Push to main branch; change if your default branch is not 'main'
          git push origin HEAD:main
